name: Waters Roux - exact artifact Microsoft Defender scan

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'docs/WATERS_ROUX_ARTIFACT_SCAN_REQUEST.md'
      - '.github/workflows/waters-roux-artifact-security-scan.yml'

permissions:
  contents: read
  actions: read

jobs:
  defender-scan:
    name: Scan actual Integrated Beta 27 ZIP on Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Download exact already-built artifact 13785467800
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          Invoke-WebRequest -Uri 'https://api.github.com/repos/WynnieOS/Waters-Roux-Viewer/actions/artifacts/13785467800/zip' -Headers $headers -OutFile 'github-artifact.zip'
          if (-not (Test-Path 'github-artifact.zip')) { throw 'Artifact download missing' }
          $sha = (Get-FileHash 'github-artifact.zip' -Algorithm SHA256).Hash
          Write-Host "GitHub-generated transport artifact SHA256: $sha"
          Expand-Archive -LiteralPath 'github-artifact.zip' -DestinationPath 'outer'
          $innerZip = Get-ChildItem 'outer' -Recurse -Filter 'Waters-Roux-Integrated-Beta27-Windows.zip' | Select-Object -First 1
          if (-not $innerZip) { throw 'Exact integrated ZIP missing from artifact' }
          $innerHash = (Get-FileHash $innerZip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Integrated ZIP SHA256: $innerHash"
          if ($innerHash -ne '9bf17874022d431875d66d9e9d90ecf489304c99ec30743dc2bc554abdafe33c') {
            throw 'Integrated ZIP hash differs from independently inspected artifact'
          }
          Expand-Archive -LiteralPath $innerZip.FullName -DestinationPath 'unpacked'
          $exe = Get-ChildItem 'unpacked' -Recurse -Filter 'waters-roux-viewer.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Viewer EXE missing' }
          $exeHash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Viewer EXE SHA256: $exeHash"
          if ($exeHash -ne '49ca44176c320f6d4157631089e52e3d811129140c824b6e514c40dcb410a9cd') {
            throw 'Executable hash differs from independently inspected artifact'
          }
          Get-ChildItem 'unpacked' -Recurse -File | ForEach-Object { Write-Host "INVENTORY: $($_.FullName.Substring((Get-Location).Path.Length + 1)) [$($_.Length) bytes]" }

      - name: Windows Defender signatures and scan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $status = Get-MpComputerStatus -ErrorAction Stop
          Write-Host "AntivirusEnabled=$($status.AntivirusEnabled)"
          Write-Host "RealTimeProtectionEnabled=$($status.RealTimeProtectionEnabled)"
          Write-Host "AntivirusSignatureVersion=$($status.AntivirusSignatureVersion)"
          Write-Host "AntivirusSignatureLastUpdated=$($status.AntivirusSignatureLastUpdated)"
          if (-not $status.AntivirusEnabled) { throw 'Microsoft Defender antivirus disabled: cannot certify scan' }
          Update-MpSignature -ErrorAction Stop
          $status = Get-MpComputerStatus -ErrorAction Stop
          Write-Host "ScanSignatureVersion=$($status.AntivirusSignatureVersion)"
          $before = @(Get-MpThreatDetection -ErrorAction SilentlyContinue | ForEach-Object ThreatID)
          try {
            Start-MpScan -ScanType CustomScan -ScanPath (Join-Path (Get-Location).Path 'unpacked') -ErrorAction Stop
          } finally {
            $after = @(Get-MpThreatDetection -ErrorAction SilentlyContinue)
            $newDetections = @($after | Where-Object { $_.ThreatID -notin $before })
            foreach ($hit in $newDetections) {
              Write-Host "DETECTION: ThreatID=$($hit.ThreatID) Resources=$($hit.Resources)"
            }
            if ($newDetections.Count -gt 0) { throw "Microsoft Defender detected $($newDetections.Count) threat(s)" }
          }
          Write-Host 'Microsoft Defender custom scan completed with no newly recorded detections.'
