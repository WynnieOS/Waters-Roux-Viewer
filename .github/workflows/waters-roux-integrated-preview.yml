name: Waters Roux — integrated Windows beta candidate

# Build an isolated candidate from the latest branded Beta 27 plus the
# separately reviewed toolbar and object-editor branches.
# This workflow never pushes merges to any source branch or publishes releases.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/waters-roux-integrated-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waters-roux-integrated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate-and-package:
    name: Integrate, verify and package Windows candidate
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout branded Beta 27
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Switch to branded Beta 27 source
        shell: pwsh
        run: |
          git fetch origin feat/waters-roux-beta27
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch branded Beta 27.' }
          git checkout --detach origin/feat/waters-roux-beta27
          if ($LASTEXITCODE -ne 0) { throw 'Unable to check out branded Beta 27.' }

      - name: Merge candidate feature branches locally (never push)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "Waters Roux CI"
          git config user.email "ci@users.noreply.github.com"
          git fetch origin main fix/beta27-photo-toolbar-controls fix/waters-roux-edit-transform-modes
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch integration branches.' }
          git merge --no-edit --no-ff origin/fix/beta27-photo-toolbar-controls
          if ($LASTEXITCODE -ne 0) {
            git status --short
            throw 'Toolbar/360 branch conflicts with branded Beta 27: resolve before building.'
          }
          git merge --no-edit --no-ff origin/fix/waters-roux-edit-transform-modes
          if ($LASTEXITCODE -ne 0) {
            git status --short
            throw 'Editing branch conflicts with integrated Beta 27: resolve before building.'
          }
          git log -4 --format='%h %s'

      - name: Install Rust
        shell: pwsh
        run: rustup update stable --no-self-update

      - name: Prepare icon from approved assets (if present)
        shell: pwsh
        run: ./scripts/prepare-waters-roux-icon.ps1

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: waters-roux-release-preview

      - name: Strict formatting
        shell: pwsh
        run: cargo fmt --all -- --check

      - name: Windows Clippy
        shell: pwsh
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Windows viewer tests
        shell: pwsh
        run: cargo test --locked -p aurora-viewer --bin aurora-viewer

      - name: Build portable Windows application
        shell: pwsh
        run: cargo build --release --locked -p aurora-viewer --features xr-static-loader

      - name: Package separate integrated preview
        shell: pwsh
        run: |
          $folder = "Waters-Roux-Integrated-Beta27-${{ github.run_number }}"
          ./scripts/package-waters-roux-preview.ps1 -Exe target/release/aurora-viewer.exe -Out $folder
          @(
            "Experimental integration candidate"
            "Beta 27 branded branch + toolbar/360 branch + object editor branch"
            "Do not replace an earlier beta; use a clean extraction."
            "Successful compilation does not replace in-world Windows acceptance."
          ) | Set-Content -LiteralPath (Join-Path $folder 'INTEGRATION-STATUS.txt') -Encoding utf8
          Compress-Archive -LiteralPath $folder -DestinationPath Waters-Roux-Integrated-Beta27-Windows.zip

      - name: Upload downloadable candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Waters-Roux-Integrated-Beta27-Windows
          path: Waters-Roux-Integrated-Beta27-Windows.zip
          retention-days: 14
          compression-level: 6
