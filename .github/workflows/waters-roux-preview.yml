name: Waters Roux — Windows preview

# This is intentionally a development preview, never a public release or
# installer. Do not trigger upstream Aurora's tag/release workflows.
on:
  push:
    branches: [feat/waters-roux-branded-beta, feat/waters-roux-beta27]
  pull_request:
    paths:
      - '.github/workflows/waters-roux-preview.yml'
      - 'crates/**'
      - 'assets/branding/**'
      - 'scripts/package*.ps1'
      - 'scripts/prepare-waters-roux-icon.ps1'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waters-roux-preview-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/feat/waters-roux-beta27' }}

jobs:
  preview:
    name: Compile Windows preview
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Install Rust
        shell: pwsh
        run: rustup update stable --no-self-update
      - name: Prepare original-logo Windows icon
        shell: pwsh
        run: ./scripts/prepare-waters-roux-icon.ps1
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: waters-roux-release-preview
      - name: Build portable Windows application
        shell: pwsh
        run: cargo build --release --locked -p aurora-viewer --features xr-static-loader
      - name: Assemble development preview
        shell: pwsh
        run: |
          $folder = "Waters-Roux-Viewer-Beta-27-${{ github.sha }}"
          ./scripts/package-waters-roux-preview.ps1 -Exe target/release/aurora-viewer.exe -Out $folder
          Compress-Archive -LiteralPath $folder -DestinationPath Waters-Roux-Viewer-Beta-27-Windows.zip
      - name: Upload portable preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Waters-Roux-Viewer-Beta-27-Windows
          path: Waters-Roux-Viewer-Beta-27-Windows.zip
          retention-days: 14
          compression-level: 6
