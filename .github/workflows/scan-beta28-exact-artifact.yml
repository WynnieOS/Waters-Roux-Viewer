name: Scan exact Waters Roux Beta 28 MP4 artifact

on:
  push:
    branches:
      - security/scan-beta28-exact-artifact
    paths:
      - .github/workflows/scan-beta28-exact-artifact.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/scan-beta28-exact-artifact.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  independent-clamav-scan:
    name: Independent antivirus scan (exact blocked ZIP)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download exact previously blocked GitHub build artifact
        uses: actions/download-artifact@v4
        with:
          name: Waters-Roux-Beta28-V2-H264-MP4-Windows-QA-ONLY
          run-id: 43318363971
          repository: WynnieOS/Waters-Roux-Viewer
          github-token: ${{ github.token }}
          path: scan-input

      - name: Verify signed-off ZIP SHA-256 and extract without executing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import pathlib
          import zipfile
          root = pathlib.Path.cwd()
          zip_path = root/'scan-input'/'Waters-Roux-H264-MP4-UNVERIFIED-Windows.zip'
          checksum = zip_path.with_name(zip_path.name+'.sha256')
          expected = 'ab6f569f9d602baca6a0499fb58eaddd059a874b9954cd07f9981793118ff6b2'
          assert zip_path.is_file() and checksum.is_file(), 'Nested ZIP/checksum not found'
          observed = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          assert observed == expected, f'ZIP SHA256 mismatch: {observed}'
          assert expected in checksum.read_text().lower(), 'Checksum sidecar mismatch'
          dest = root/'extracted'
          dest.mkdir(exist_ok=True)
          with zipfile.ZipFile(zip_path) as z:
            assert z.testzip() is None, 'Corrupt ZIP entry'
            for item in z.infolist():
              candidate = (dest/item.filename).resolve()
              assert candidate.is_relative_to(dest.resolve()), f'Unsafe ZIP path {item.filename}'
              assert not ((item.external_attr >> 16) & 0o170000 == 0o120000), 'Symlink in ZIP'
            z.extractall(dest)
          exes = sorted(p.relative_to(dest).as_posix() for p in dest.rglob('*.exe'))
          print('Exact ZIP verified:', observed)
          print('Executables found:', exes)
          assert len(exes) == 3, f'Unexpected EXE count: {len(exes)}'
          with (root/'scan-manifest.txt').open('w') as out:
            out.write(f'Inner ZIP SHA256: {observed}\n')
            out.write('EXEs (not executed):\n'+'\n'.join(exes)+'\n')
          PY

      - name: Install ClamAV and update signature databases
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam --stdout
          clamscan --version

      - name: Independently scan exact ZIP and all extracted files
        shell: bash
        run: |
          set -euo pipefail
          # clamscan returns 0 for a completed clean scan, 1 for detections,
          # and 2 for errors. Do not require a nonexistent "Total errors" line.
          clamscan --recursive --infected --scan-archive=yes --max-filesize=256M --max-scansize=1024M --max-recursion=20 --log=clamav-scan.log scan-input extracted
          grep -Eq '^Infected files:[[:space:]]+0
          {
            echo '### ClamAV result for exact browser-blocked artifact'
            echo 'Verified inner ZIP SHA256: `ab6f569f9d602baca6a0499fb58eaddd059a874b9954cd07f9981793118ff6b2`'
            echo 'ClamAV signature database updated; zero detections and zero scan errors reported.'
            echo 'No viewer executable was launched. Clean ClamAV is not a guarantee of safety or Chrome clearance.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan manifest and log (even if scanner fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Waters-Roux-Beta28-Independent-Scan-Report
          path: |
            scan-manifest.txt
            clamav-scan.log
          if-no-files-found: ignore
 clamav-scan.log
          if grep -Eq '(^|[[:space:]])(ERROR|FOUND)[:[:space:]]' clamav-scan.log; then
            echo 'ClamAV output contains an error or detection; inspect scan report' >&2
            exit 1
          fi
          {
            echo '### ClamAV result for exact browser-blocked artifact'
            echo 'Verified inner ZIP SHA256: `ab6f569f9d602baca6a0499fb58eaddd059a874b9954cd07f9981793118ff6b2`'
            echo 'ClamAV signature database updated; zero detections and zero scan errors reported.'
            echo 'No viewer executable was launched. Clean ClamAV is not a guarantee of safety or Chrome clearance.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan manifest and log (even if scanner fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Waters-Roux-Beta28-Independent-Scan-Report
          path: |
            scan-manifest.txt
            clamav-scan.log
          if-no-files-found: ignore
