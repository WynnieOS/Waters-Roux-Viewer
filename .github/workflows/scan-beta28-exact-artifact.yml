name: Scan exact Waters Roux Beta 28 MP4 artifact

on:
  push:
    branches:
      - security/scan-beta28-exact-artifact
    paths:
      - .github/workflows/scan-beta28-exact-artifact.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/scan-beta28-exact-artifact.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  scan-windows-zip:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Download exact previously blocked GitHub build artifact
        uses: actions/download-artifact@v4
        with:
          name: Waters-Roux-Beta28-V2-H264-MP4-Windows-QA-ONLY
          run-id: 43318363971
          repository: WynnieOS/Waters-Roux-Viewer
          github-token: ${{ github.token }}
          path: scan-input

      - name: Verify exact inner ZIP hash, check archive contents without executing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $PWD 'scan-input/Waters-Roux-H264-MP4-UNVERIFIED-Windows.zip'
          $checksum = Join-Path $PWD 'scan-input/Waters-Roux-H264-MP4-UNVERIFIED-Windows.zip.sha256'
          if (-not (Test-Path -LiteralPath $zip)) { throw 'Expected artifact ZIP is missing' }
          if (-not (Test-Path -LiteralPath $checksum)) { throw 'Embedded checksum file is missing' }
          $expected = 'ab6f569f9d602baca6a0499fb58eaddd059a874b9954cd07f9981793118ff6b2'
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Artifact hash mismatch: $actual" }
          if (-not ((Get-Content -LiteralPath $checksum -Raw).ToLowerInvariant().Contains($expected))) { throw 'Embedded checksum does not match' }
          New-Item -ItemType Directory -Path 'extracted' -Force | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath 'extracted' -Force
          $exe = @(Get-ChildItem -LiteralPath 'extracted' -Recurse -File -Filter '*.exe')
          if ($exe.Count -ne 3) { throw "Unexpected number of executables: $($exe.Count)" }
          foreach ($item in $exe) {
            $sha = (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $signature = Get-AuthenticodeSignature -FilePath $item.FullName
            Write-Host "$($item.Name): SHA256=$sha; Authenticode=$($signature.Status)"
          }
          "ZIP SHA256: $actual" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Executable count: $($exe.Count). No executable was launched." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Update Microsoft Defender signatures and scan ZIP plus extracted contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Update-MpSignature -ErrorAction Stop
          $status = Get-MpComputerStatus -ErrorAction Stop
          if (-not $status.AntivirusEnabled -or -not $status.RealTimeProtectionEnabled) { throw 'Defender is not enabled' }
          Write-Host "Defender signatures updated: $($status.AntivirusSignatureVersion)"
          Start-MpScan -ScanType CustomScan -ScanPath (Join-Path $PWD 'scan-input') -ErrorAction Stop
          Start-MpScan -ScanType CustomScan -ScanPath (Join-Path $PWD 'extracted') -ErrorAction Stop
          $detections = @(Get-MpThreatDetection -ErrorAction SilentlyContinue)
          if ($detections.Count -gt 0) {
            $detections | Format-List | Out-String | Write-Host
            throw 'Microsoft Defender reported a threat detection'
          }
          'Defender scan of exact artifact ZIP and extracted files: no detections reported.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Host 'Defender scan of exact artifact ZIP and extracted files: no detections reported.'
