name: Waters Roux Beta 28 V2 — H264 MP4 Windows QA candidate

# On a pull request this builds a separate portable *testing candidate*.
# Never deploy or merge changes as part of packaging.
on:
  pull_request:
    branches: [fix/beta28-v2-camera-recorder-artwork]
    paths:
      - '.github/workflows/waters-roux-beta28-v2-windows-test.yml'
      - 'assets/branding/**'
      - 'scripts/package.ps1'
      - 'scripts/bundle-waters-roux-ffmpeg.ps1'
      - 'scripts/integrate-waters-roux-mp4-ui.ps1'
      - 'docs/WATERS_ROUX_BETA28_PACKAGE_REQUEST.md'
      - 'crates/aurora-viewer/src/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waters-roux-beta28-branded-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Integrate, test, scan and package Windows creator beta
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Integrate branded beta and creator fixes locally
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "Waters Roux CI"
          git config user.email "ci@users.noreply.github.com"
          git fetch origin feat/waters-roux-beta27 fix/waters-roux-beta28-recording-beam fix/waters-roux-edit-transform-modes fix/beta28-v2-camera-recorder-artwork feat/waters-roux-h264-mp4-recorder
          if ($LASTEXITCODE -ne 0) { throw "Couldn't fetch creator integration branches" }
          git checkout --detach origin/feat/waters-roux-beta27
          if ($LASTEXITCODE -ne 0) { throw "Couldn't start branded Beta 27 source" }
          git merge --no-edit --no-ff origin/fix/waters-roux-beta28-recording-beam
          if ($LASTEXITCODE -ne 0) { git status --short; throw "Creator branch merge conflicted" }
          git merge --no-edit --no-ff origin/fix/waters-roux-edit-transform-modes
          if ($LASTEXITCODE -ne 0) { git status --short; throw "Editing branch merge conflicted" }
          # Keep Beta 27 branded UI while bringing in H.264, MP4, and AAC
          # changes only. Do not merge the Aurora-based feature branch wholesale.
          git restore --source origin/feat/waters-roux-h264-mp4-recorder -- crates/aurora-viewer/src/app/recording.rs crates/aurora-viewer/src/app/recording/mp4.rs crates/aurora-viewer/src/ui/machinima.rs scripts/bundle-waters-roux-ffmpeg.ps1 scripts/integrate-waters-roux-mp4-ui.ps1 crates/aurora-render/src/renderer.rs crates/aurora-viewer/src/build/manip.rs crates/aurora-viewer/src/world/eep.rs
          if ($LASTEXITCODE -ne 0) { throw 'Could not import H.264 MP4 implementation' }
          git log -4 --format='%h %s'
          git status --short

      - name: Wire asynchronous MP4 finalization into branded Waters Roux app
        shell: pwsh
        run: ./scripts/integrate-waters-roux-mp4-ui.ps1

      - name: Block unbranded source before compiling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'crates/aurora-viewer/src/branding.rs',
            'crates/aurora-viewer/src/ui/branding.rs',
            'crates/aurora-viewer/src/ui/branding_runtime.rs',
            'scripts/package-waters-roux-preview.ps1',
            'assets/branding/waters-roux-logo.png',
            'assets/branding/waters-roux-background.png',
            'assets/branding/waters-roux-loading-background.png',
            'assets/branding/waters-roux.ico'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Refusing unbranded build: missing $path" }
          }
          $login = Get-Content -LiteralPath 'crates/aurora-viewer/src/ui/login.rs' -Raw
          if (-not $login.Contains('waters-roux-name')) { throw 'Refusing Aurora login UI: Waters Roux login heading missing' }
          if ($login.Contains('RichText::new("Aurora Viewer")')) { throw 'Refusing unbranded login heading' }
          $app = Get-Content -LiteralPath 'crates/aurora-viewer/src/app.rs' -Raw
          if (-not $app.Contains('/waters-roux-logo.png')) { throw 'Refusing Aurora runtime logo' }
          $build = Get-Content -LiteralPath 'crates/aurora-viewer/build.rs' -Raw
          if (-not $build.Contains('ProductName", "Waters Roux Viewer"')) { throw 'Refusing Aurora Windows product identity' }
          if (-not (Get-Content -LiteralPath 'crates/aurora-viewer/src/ui/mod.rs' -Raw).Contains('pub mod branding_runtime')) { throw 'Branding runtime module removed' }
          $recorder = Get-Content -LiteralPath 'crates/aurora-viewer/src/app/recording.rs' -Raw
          if (-not $recorder.Contains('mod mp4;') -or -not $recorder.Contains('Waters-Roux-{base}-{i:03}.mp4')) { throw 'H.264 MP4 recorder not integrated' }
          if (-not (Test-Path -LiteralPath 'crates/aurora-viewer/src/app/recording/mp4.rs')) { throw 'H.264 encoder backend missing' }
          if (-not (Get-Content -LiteralPath 'crates/aurora-viewer/src/app.rs' -Raw).Contains('self.recorder.stop_async()')) { throw 'Nonblocking MP4 stop not wired to branded viewer' }
          if (-not (Get-Content -LiteralPath 'crates/aurora-viewer/src/app.rs' -Raw).Contains('self.recorder.poll_finalization()')) { throw 'MP4 finalize notifications missing' }
          'Waters Roux branded login, customization modules, runtime logo, and Windows identity verified in source.'

      - name: Install Rust
        shell: pwsh
        run: rustup update stable --no-self-update

      - name: Prepare Waters Roux icon
        shell: pwsh
        run: ./scripts/prepare-waters-roux-icon.ps1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: waters-roux-beta28

      - name: Normalize integrated Rust formatting (QA only)
        shell: pwsh
        run: cargo fmt --all

      - name: Strict formatting
        shell: pwsh
        run: cargo fmt --all -- --check

      - name: Download and stage pinned FFmpeg encoder for tests
        shell: pwsh
        run: |
          $staged = Join-Path $env:RUNNER_TEMP 'waters-roux-qa-codecs'
          ./scripts/bundle-waters-roux-ffmpeg.ps1 -Out $staged
          if ($LASTEXITCODE -ne 0) { throw 'Pinned H.264 FFmpeg stage failed' }
          $exe = Join-Path $staged 'tools/ffmpeg.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Verified FFmpeg missing' }
          "WATERS_ROUX_FFMPEG=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          'WATERS_ROUX_TEST_MP4=1' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $fixture = Join-Path $env:RUNNER_TEMP 'waters-roux-recorder-output.mp4'
          "WATERS_ROUX_TEST_MP4_OUTPUT=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Windows compile and lint
        shell: pwsh
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Windows viewer tests (including recorder and GIF/style tests)
        shell: pwsh
        run: cargo test --locked -p aurora-viewer --bin aurora-viewer

      - name: Independently verify output from Waters Roux recording code
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = $env:WATERS_ROUX_TEST_MP4_OUTPUT
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw 'Viewer recorder did not output an MP4 fixture' }
          $staged = Join-Path $env:RUNNER_TEMP 'waters-roux-qa-codecs/tools'
          $ffmpeg = Join-Path $staged 'ffmpeg.exe'
          $ffprobe = Join-Path $staged 'ffprobe.exe'
          $probeJson = & $ffprobe -v error -show_entries 'stream=codec_name,codec_type,width,height,r_frame_rate,nb_frames' -show_entries 'format=duration' -of json $path | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Cannot probe Waters Roux-generated MP4' }
          $metadata = $probeJson | ConvertFrom-Json
          $video = @($metadata.streams | Where-Object { $_.codec_type -eq 'video' })[0]
          if ($null -eq $video -or $video.codec_name -ne 'h264' -or $video.width -ne 64 -or $video.height -ne 64 -or $video.r_frame_rate -ne '30/1') {
            throw "Viewer-generated MP4 failed H.264/size/FPS verification: $probeJson"
          }
          if ($video.nb_frames -and [int]$video.nb_frames -ne 30) { throw 'Viewer MP4 is not 30 frames as requested' }
          if ([double]$metadata.format.duration -lt 0.95 -or [double]$metadata.format.duration -gt 1.1) { throw 'Viewer-generated MP4 duration drift' }
          & $ffmpeg -hide_banner -loglevel error -i $path -f null -
          if ($LASTEXITCODE -ne 0) { throw 'Viewer-generated MP4 cannot be fully decoded' }
          'Waters Roux actual recorder fixture passed ffprobe duration/FPS/H.264 and full decode.'

      - name: Independently validate H.264 MP4 + AAC encoder playback fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $staged = Join-Path $env:RUNNER_TEMP 'waters-roux-qa-codecs/tools'
          $ffmpeg = Join-Path $staged 'ffmpeg.exe'
          $ffprobe = Join-Path $staged 'ffprobe.exe'
          $sample = Join-Path $env:RUNNER_TEMP 'h264-aac-playback-test.mp4'
          & $ffmpeg -hide_banner -loglevel error -f lavfi -i 'testsrc2=size=640x360:rate=30' -f lavfi -i 'sine=frequency=440:sample_rate=48000' -t 2 -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a aac -b:a 192k -shortest -movflags +faststart -y $sample
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg H.264/AAC playback fixture failed' }
          $data = & $ffprobe -v error -show_entries 'stream=codec_name,codec_type,width,height,r_frame_rate' -show_entries 'format=duration' -of json $sample | Out-String | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'FFprobe cannot decode MP4 fixture' }
          $v = @($data.streams | Where-Object { $_.codec_type -eq 'video' })[0]
          $a = @($data.streams | Where-Object { $_.codec_type -eq 'audio' })[0]
          if ($v.codec_name -ne 'h264' -or $v.width -ne 640 -or $v.height -ne 360 -or $v.r_frame_rate -ne '30/1') { throw 'MP4 video codec/resolution/FPS invalid' }
          if ($a.codec_name -ne 'aac') { throw 'MP4 audio codec invalid' }
          if ([double]$data.format.duration -lt 1.8 -or [double]$data.format.duration -gt 2.3) { throw 'MP4 duration invalid' }
          'Verified FFmpeg output: playable H.264 640x360 30 FPS MP4 + AAC, ~2 seconds.'

      - name: Build portable Windows application
        shell: pwsh
        run: cargo build --release --locked -p aurora-viewer --features xr-static-loader

      - name: Assemble portable Beta 28 candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = 'Waters-Roux-Creator-Beta28-V2-Windows'
          ./scripts/package-waters-roux-preview.ps1 -Exe target/release/aurora-viewer.exe -Out $folder
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          @(
            'Waters Roux Creator Beta 28 V2 — experimental Windows testing candidate'
            'Built from branded Beta 27, Beta 28 creator repairs, and editing fixes.'
            'PhotoTools, separate Pose Stand, hand-selection beam, machinima bar and Name Tag Studio.'
            'Recorder: native viewport, 480p, 720p, 1080p, 1440p, 2160p and 24/30/60 fps; real-time playback requires in-world testing.'
            'Video fixes: H.264 MP4 output, timestamp-based CFR capture, opt-in POV stabilization and independent HUD and interface capture controls.'
            'Selection beam: presets, color, density, speed, PNG import; local to viewer.'
            'Direct RGBA-to-H.264 encoding (no MJPEG intermediary) and bounded encoder queue. In-world playback remains unverified.'
            'H.264 MP4/AAC implementation uses separately bundled GPLv3 FFmpeg. User microphone narration is NOT captured.'
            'Verify real-world MP4 playback, frame quality, recording stop/finalization and audio sync before any public release; respect participant consent.'
            'MP4 finalizes asynchronously after Stop; do not exit until saved confirmation. Verify real-world timing in-world.'
            'GPLv3 source/distribution compliance needs review before any public release.'
            'Image/GIF name-tag customization is local only and must be tested in-world.'
            'This is not a production release; a CI build does not prove in-world functionality.'
            'Do not overwrite an earlier beta; extract to a NEW folder.'
            'Chrome previously flagged a Beta 27 download; do not bypass browser warnings.'
          ) | Set-Content -LiteralPath (Join-Path $folder 'BETA28-TESTING-STATUS.txt') -Encoding utf8

      - name: Bundle separately licensed H.264 encoder in portable test package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $staged = Join-Path $env:RUNNER_TEMP 'waters-roux-qa-codecs'
          $destination = 'Waters-Roux-Creator-Beta28-V2-Windows'
          Copy-Item -LiteralPath (Join-Path $staged 'tools') -Destination (Join-Path $destination 'tools') -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $staged 'third-party') -Destination (Join-Path $destination 'third-party') -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $staged 'THIRD-PARTY-FFMPEG.txt') -Destination $destination -Force
          if (-not (Test-Path -LiteralPath (Join-Path $destination 'tools/ffmpeg.exe'))) { throw 'MP4 encoder missing in package' }
          if (-not (Test-Path -LiteralPath (Join-Path $destination 'third-party/ffmpeg') -PathType Container)) { throw 'FFmpeg GPL license missing from package' }

      - name: Verify official Waters Roux artwork, launcher and branding in Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceDir = Join-Path $PWD 'assets/branding'
          $packageDir = Join-Path $PWD 'Waters-Roux-Creator-Beta28-V2-Windows/assets/branding'
          foreach ($requiredFile in @('waters-roux-viewer.exe', 'Launch Waters Roux.cmd', 'waters-roux-portable.txt', 'START-HERE.txt', 'tools/ffmpeg.exe', 'tools/ffprobe.exe', 'THIRD-PARTY-FFMPEG.txt')) {
            if (-not (Test-Path -LiteralPath (Join-Path $PWD ('Waters-Roux-Creator-Beta28-V2-Windows/' + $requiredFile)) -PathType Leaf)) { throw "Missing branded viewer entry: $requiredFile" }
          }
          if (Test-Path -LiteralPath 'Waters-Roux-Creator-Beta28-V2-Windows/aurora-viewer.exe') { throw 'Aurora EXE packaged as Waters Roux' }
          $required = @(
            'waters-roux-logo.png',
            'waters-roux-background.png',
            'waters-roux-loading-background.png',
            'waters-roux.ico'
          )
          foreach ($name in $required) {
            $sourcePath = Join-Path $sourceDir $name
            $packagePath = Join-Path $packageDir $name
            if (-not (Test-Path -LiteralPath $sourcePath -PathType Leaf)) {
              throw "Official artwork missing from source: $sourcePath"
            }
            if (-not (Test-Path -LiteralPath $packagePath -PathType Leaf)) {
              throw "Official artwork missing from Windows package: $packagePath"
            }
            $expected = (Get-FileHash -LiteralPath $sourcePath -Algorithm SHA256).Hash
            $actual = (Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash
            if ($expected -ne $actual) {
              throw "Official artwork changed during packaging: $name"
            }
            Write-Host "Verified packaged official artwork: $name"
          }
          $login = (Get-FileHash -LiteralPath (Join-Path $packageDir 'waters-roux-background.png') -Algorithm SHA256).Hash
          $loading = (Get-FileHash -LiteralPath (Join-Path $packageDir 'waters-roux-loading-background.png') -Algorithm SHA256).Hash
          if ($login -ne $loading) { throw 'Login and loading backgrounds must be identical.' }
          if (Test-Path -LiteralPath (Join-Path $PWD 'Waters-Roux-Creator-Beta28-V2-Windows/MISSING-ARTWORK.txt')) {
            throw 'Package still contains the MISSING-ARTWORK warning.'
          }
          'All four official artwork files are present and verified in the Windows package.'

      - name: Scan candidate using Microsoft Defender
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Update-MpSignature
          $before = @(Get-MpThreatDetection | Select-Object -ExpandProperty ThreatID)
          Start-MpScan -ScanType CustomScan -ScanPath (Join-Path $PWD 'Waters-Roux-Creator-Beta28-V2-Windows')
          $after = @(Get-MpThreatDetection | Select-Object -ExpandProperty ThreatID)
          $new = @($after | Where-Object { $_ -notin $before })
          if ($new.Count -gt 0) { throw "Microsoft Defender reported new detections" }
          'Manual Defender scan completed with no newly recorded detections.'

      - name: ZIP and SHA256
        shell: pwsh
        run: |
          $zip = 'Waters-Roux-H264-MP4-UNVERIFIED-Windows.zip'
          Compress-Archive -Path 'Waters-Roux-Creator-Beta28-V2-Windows' -DestinationPath $zip
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $zip" | Set-Content -LiteralPath "$zip.sha256" -Encoding utf8
          "SHA256: $sha"

      - name: Upload portable testing candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Waters-Roux-Beta28-V2-H264-MP4-Windows-QA-ONLY
          path: |
            Waters-Roux-H264-MP4-UNVERIFIED-Windows.zip
            Waters-Roux-H264-MP4-UNVERIFIED-Windows.zip.sha256
          retention-days: 14
          compression-level: 6
