name: Waters Roux Beta 28 v2 Windows Test

# Standalone Windows build for the Beta 28 v2 repair PR. It intentionally
# does not depend on macOS/Linux dry runs or the expensive dump_syms job.
# Never publish a release or merge automatically.
on:
  pull_request:
    # This experimental workflow only needs to follow its repair PR.
    paths:
      - .github/workflows/waters-roux-beta28-v2-windows-test.yml
      - crates/aurora-viewer/**
      - assets/branding/**
      - scripts/package.ps1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waters-roux-beta28-windows-${{ github.ref }}
  # Don't discard a nearly completed Windows compilation when the PR changes.
  cancel-in-progress: false

jobs:
  windows-test:
    if: github.event_name != 'pull_request' || github.head_ref == 'fix/beta28-v2-camera-recorder-artwork'
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Rust stable
        shell: pwsh
        run: rustup update stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Compile Waters Roux viewer
        shell: pwsh
        run: |
          cargo build --release --locked -p aurora-viewer --features xr-static-loader
          if ($LASTEXITCODE -ne 0) { throw "Viewer compilation failed" }
      - name: Build and verify Windows test ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "Waters-Roux-Beta28-v2-Windows-x64"
          ./scripts/package.ps1 -Exe target/release/aurora-viewer.exe -Out $dir
          if ($LASTEXITCODE -ne 0) { throw "Viewer packaging failed" }
          $exe = Join-Path $dir 'aurora-viewer.exe'
          $logo = Join-Path $dir 'assets/branding/waters-roux-logo.png'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Missing executable" }
          if (-not (Test-Path -LiteralPath $logo)) { throw "Missing Waters Roux artwork" }
          $logoBytes = [IO.File]::ReadAllBytes($logo)
          if ($logoBytes.Length -lt 512 -or $logoBytes[0] -ne 137 -or $logoBytes[1] -ne 80) { throw "Invalid artwork asset" }
          $info = (Get-Item $exe).VersionInfo
          if ($info.FileDescription -ne 'Waters Roux Viewer') { throw "Missing executable branding: $($info.FileDescription)" }
          if (-not (Test-Path (Join-Path $dir 'aurora-install.json'))) { throw "Missing installer metadata" }
          Compress-Archive -Path $dir -DestinationPath "$dir.zip" -CompressionLevel Optimal
          $sha = (Get-FileHash -LiteralPath "$dir.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $dir.zip" | Set-Content -Path "$dir.zip.sha256" -Encoding utf8
          "Packaged Windows test build from commit ${{ github.sha }}"
          "SHA-256: $sha"
      - name: Upload verified Windows test ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Waters-Roux-Beta28-v2-Windows-test
          path: |
            Waters-Roux-Beta28-v2-Windows-x64.zip
            Waters-Roux-Beta28-v2-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
