name: Waters Roux — Windows verification

# Build validation for the independent Waters Roux viewer fork.
# No credentials, login, releases or downloads; it never connects to a grid.
on:
  push:
    branches: [feat/waters-roux-branded-beta, feat/waters-roux-beta27]
  pull_request:
    paths:
      - '.github/workflows/waters-roux-verify.yml'
      - 'crates/**'
      - 'assets/branding/**'
      - 'scripts/package*.ps1'
      - 'scripts/prepare-waters-roux-icon.ps1'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waters-roux-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Rust and glass UI checks
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Install Rust stable with formatting tools
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup component add rustfmt clippy
      - name: Prepare original-logo Windows icon
        shell: pwsh
        run: ./scripts/prepare-waters-roux-icon.ps1
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: waters-roux-windows
      - name: Validate formatting
        shell: pwsh
        run: cargo fmt --all -- --check
      - name: Clippy with warnings as errors
        shell: pwsh
        run: cargo clippy --locked --profile ci --workspace --all-targets -- -D warnings
      - name: Check viewer and all tests
        shell: pwsh
        run: cargo check --locked --profile ci --all-targets -p aurora-viewer
      - name: Run Waters Roux brand and glass tests
        shell: pwsh
        run: cargo test --locked --profile ci --workspace waters_roux_
      - name: Independent artwork, validation and appearance transaction tests
        shell: pwsh
        run: cargo test --locked --profile ci --workspace branding
      - name: Login, glass and profile regression tests
        shell: pwsh
        run: |
          # PowerShell otherwise reports only the final native command's
          # status, masking a failure in an earlier regression filter.
          foreach ($filter in @('ui::login', 'ui::loading', 'login_accounts', 'interface_colors', 'credentials', 'ui::theme_guard', 'ui::quick_prefs', 'cli::tests', 'ui::about', 'high_contrast', 'uninstall', 'ui::news')) {
            cargo test --locked --profile ci --workspace $filter
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
